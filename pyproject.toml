[project]
name = "xr-compression-lab"
version = "0.1.0"
description = "Data Compression course baseline: codec study with bandwidth-adaptive, viewport-aware streaming on XR spatial media"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8.0",
    "aiortc>=1.15.0",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "websockets>=17.2",
]
